---
name: make on Fedora

# Configures this workflow to run every time a tag is pushed

on:
  push:
    tags:             # Pattern matched against refs/tags
    - 'fedora*'           # Push events to every tag not containing /
  workflow_dispatch:

jobs:
  call-workflow:
    uses: ./.github/workflows/container-build.yml
    with:
      distro: fedora
    secrets: inherit
